<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Τσοτύλι – Κάμερα & Καιρός</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f2f2f2;
    }
    h1 { text-align: center; margin-top: 20px; }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 95%;
      max-width: 1200px;
    }
    iframe {
      width: 100%;
      max-width: 1200px;
      height: 750px;
      border: 0;
      margin: 10px 0;
    }
    .weather {
      width: 100%;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .weather h2 { margin-bottom: 15px; }
    .weather-item { display: flex; align-items: center; margin: 5px 0; font-size: 1.1em; }
    .weather-item i { font-size: 32px; margin-right: 10px; color: #333; }
    .forecast {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .forecast-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 5px 10px;
      font-size: 0.9em;
    }
    .forecast-item i { font-size: 36px; color: #333; }
    @media (min-width: 700px) {
      .container { flex-direction: row; justify-content: space-between; }
      iframe, .weather { width: 48%; }
    }
  </style>
</head>
<body>
  <h1>Τσοτύλι – Ζωντανή Κάμερα & Καιρός</h1>
  <div class="container">
    <iframe id="camFrame" src="https://www.meteology.gr/kamera_tsotyli.html"></iframe>

    <div class="weather" id="weather">
      <h2>Live Καιρός Τσοτυλίου</h2>
      <div class="weather-item"><i id="icon" class="wi wi-day-sunny"></i><span id="temp">Θερμοκρασία: ...°C</span></div>
