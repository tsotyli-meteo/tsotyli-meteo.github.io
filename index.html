<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Τσοτύλι – Κάμερα & Καιρός</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f2f2f2;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 95%;
      max-width: 1200px;
    }
    iframe {
      width: 100%;
      max-width: 1100px;
      height: 700px;
      border: 0;
      margin: 10px 0;
    }
    .weather {
      width: 100%;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .weather h2 {
      margin-bottom: 15px;
    }
    .weather-item {
      display: flex;
      align-items: center;
      margin: 5px 0;
      font-size: 1.1em;
    }
    .weather-item img {
      width: 30px;
      height: 30px;
      margin-right: 10px;
    }
    .forecast {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .forecast-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 5px 10px;
      font-size: 0.9em;
    }
    .forecast-item img {
      width: 40px;
      height: 40px;
    }
    @media (min-width: 700px) {
      .container {
        flex-direction: row;
        justify-content: space-between;
      }
      iframe, .weather {
        width: 48%;
      }
    }
  </style>
</head>
<body>
  <h1>Τσοτύλι – Ζωντανή Κάμερα & Καιρός</h1>
  <div class="container">
    <iframe id="camFrame" src="https://www.meteology.gr/kamera_tsotyli.html"></iframe>

    <div class="weather" id="weather">
      <h2>Live Καιρός Τσοτυλίου</h2>
      <div class="weather-item">
        <img src="https://openweathermap.org/img/wn/01d.png" id="icon" alt="Weather Icon">
        <span id="temp">Θερμοκρασία: ...°C</span>
      </div>
      <div class="weather-item">
        🌬️ <span id="wind">Άνεμος: ... km/h</span>
      </div>
      <div class="weather-item">
        💧 <span id="humidity">Υγρασία: ...%</span>
      </div>
      <div class="weather-item">
        ☁️ <span id="condition">Κατάσταση: ...</span>
      </div>

      <h3>Πρόγνωση επόμενων 6 ωρών</h3>
      <div class="forecast" id="forecast">
        <!-- Forecast items θα εμφανιστούν εδώ -->
      </div>
    </div>
  </div>

  <script>
    // Smooth auto-refresh κάμερας κάθε 10 δευτερόλεπτα
    setInterval(function() {
      var iframe = document.getElementById('camFrame');
      if (iframe.contentWindow) {
        iframe.contentWindow.location.reload();
      }
    }, 10000);

    // Χάρτης κωδικών καιρού → icon
    function weatherCodeToIcon(code){
      if(code === 0) return "https://openweathermap.org/img/wn/01d.png";
      if(code <= 3) return "https://openweathermap.org/img/wn/03d.png";
      if(code <= 48) return "https://openweathermap.org/img/wn/50d.png";
      if(code <= 67) return "https://openweathermap.org/img/wn/09d.png";
      if(code <= 77) return "https://openweathermap.org/img/wn/13d.png";
      if(code <= 99) return "https://openweathermap.org/img/wn/11d.png";
      return "https://openweathermap.org/img/wn/01d.png";
    }

    function weatherCodeToText(code){
      if(code === 0) return "Καθαρός ουρανός";
      if(code <= 3) return "Συννεφιά";
      if(code <= 48) return "Ομίχλη";
      if(code <= 67) return "Βροχή/Χιονόνερο";
      if(code <= 77) return "Χιόνι";
      if(code <= 99) return "Καταιγίδα";
      return "Άγνωστο";
    }

    async function getWeather() {
      const lat = 40.3933;
      const lon = 21.8375;

      try {
        // Τρέχον καιρός
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode,windspeed_10m,relativehumidity_2m`);
        const data = await response.json();
        const weather = data.current_weather;

        document.getElementById("temp").textContent = `Θερμοκρασία: ${weather.temperature}°C`;
        document.getElementById("wind").textContent = `Άνεμος: ${weather.windspeed} km/h`;
        if(weather.relativehumidity !== undefined){
          document.getElementById("humidity").textContent = `Υγρασία: ${weather.relativehumidity}%`;
        } else {
          document.getElementById("humidity").textContent = `Υγρασία: -`;
        }
        document.getElementById("condition").textContent = `Κατάσταση: ${weatherCodeToText(weather.weathercode)}`;
        document.getElementById("icon").src = weatherCodeToIcon(weather.weathercode);

        // Πρόγνωση επόμενων 6 ωρών
        const now = new Date();
        const forecastContainer = document.getElementById("forecast");
        forecastContainer.innerHTML = "";
        for(let i=0; i<6; i++){
          const hourData = data.hourly;
          const timeISO = hourData.time[i];
          const temp = hourData.temperature_2m[i];
          const code = hourData.weathercode[i];
          const hour = new Date(timeISO).getHours();

          const item = document.createElement("div");
          item.className = "forecast-item";
          item.innerHTML = `<div>${hour}:00</div><img src="${weatherCodeToIcon(code)}" alt="icon"><div>${temp}°C</div>`;
          forecastContainer.appendChild(item);
        }

      } catch (err) {
        console.error("Σφάλμα κατά την ανάκτηση δεδομένων καιρού:", err);
      }
    }

    getWeather();
    setInterval(getWeather, 600000); // κάθε 10 λεπτά
  </script>
</body>
</html>
