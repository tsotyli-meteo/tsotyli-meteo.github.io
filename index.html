<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Τσοτύλι – Κάμερα & Καιρός</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f2f2f2;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 95%;
      max-width: 1000px;
    }
    iframe {
      width: 100%;
      max-width: 900px;
      height: 600px;
      border: 0;
      margin: 10px 0;
    }
    .weather {
      width: 100%;
      text-align: center;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    @media (min-width: 600px) {
      .container {
        flex-direction: row;
        justify-content: space-between;
      }
      iframe, .weather {
        width: 48%;
      }
    }
  </style>
</head>
<body>
  <h1>Τσοτύλι – Ζωντανή Κάμερα & Καιρός</h1>
  <div class="container">
    <iframe id="camFrame" src="https://www.meteology.gr/kamera_tsotyli.html"></iframe>

    <div class="weather" id="weather">
      <h2>Πρόγνωση Καιρού Τσοτυλίου</h2>
      <p id="temp">Θερμοκρασία: ...°C</p>
      <p id="wind">Άνεμος: ... km/h</p>
      <p id="humidity">Υγρασία: ...%</p>
    </div>
  </div>

  <script>
    // Smooth auto-refresh κάμερας κάθε 10 δευτερόλεπτα
    setInterval(function() {
      var iframe = document.getElementById('camFrame');
      if (iframe.contentWindow) {
        iframe.contentWindow.location.reload();
      }
    }, 10000);

    // Λήψη δεδομένων καιρού από Open-Meteo
    async function getWeather() {
      const lat = 40.3933;   // Τσοτύλι
      const lon = 21.8375;

      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await response.json();
        const weather = data.current_weather;

        document.getElementById("temp").textContent = `Θερμοκρασία: ${weather.temperature}°C`;
        document.getElementById("wind").textContent = `Άνεμος: ${weather.windspeed} km/h`;
        // Το Open-Meteo δεν δίνει πάντα υγρασία, αν υπάρχει:
        if(weather.relativehumidity !== undefined){
          document.getElementById("humidity").textContent = `Υγρασία: ${weather.relativehumidity}%`;
        }
      } catch (err) {
        console.error("Σφάλμα κατά την ανάκτηση δεδομένων καιρού:", err);
      }
    }

    // Φόρτωμα κατά το άνοιγμα
    getWeather();
    // Auto-refresh κάθε 10 λεπτά
    setInterval(getWeather, 600000);
  </script>
</body>
</html>
