<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Τσοτύλι – Κάμερα & Καιρός</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f2f2f2;
    }
    h1 { text-align: center; margin-top: 20px; }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 95%;
      max-width: 1200px;
    }
    iframe {
      width: 100%;
      max-width: 1200px;
      height: 750px;
      border: 0;
      margin: 10px 0;
    }
    .weather {
      width: 100%;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .weather h2 { margin-bottom: 15px; }
    .weather-item { display: flex; align-items: center; margin: 5px 0; font-size: 1.1em; }
    .weather-item i { font-size: 32px; margin-right: 10px; color: #333; }
    .forecast {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .forecast-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 5px 10px;
      font-size: 0.9em;
    }
    .forecast-item i { font-size: 36px; color: #333; }
    @media (min-width: 700px) {
      .container { flex-direction: row; justify-content: space-between; }
      iframe, .weather { width: 48%; }
    }
  </style>
</head>
<body>
  <h1>Τσοτύλι – Ζωντανή Κάμερα & Καιρός</h1>
  <div class="container">
    <iframe id="camFrame" src="https://www.meteology.gr/kamera_tsotyli.html"></iframe>

    <div class="weather" id="weather">
      <h2>Live Καιρός Τσοτυλίου</h2>
      <div class="weather-item"><i id="icon" class="wi wi-day-sunny"></i><span id="temp">Θερμοκρασία: ...°C</span></div>
      <div class="weather-item"><i class="wi wi-strong-wind"></i><span id="wind">Άνεμος: ... km/h</span></div>
      <div class="weather-item"><i class="wi wi-humidity"></i><span id="humidity">Υγρασία: ...%</span></div>
      <div class="weather-item"><i class="wi wi-cloud"></i><span id="condition">Κατάσταση: ...</span></div>

      <h3>Πρόγνωση επόμενων 6 ωρών</h3>
      <div class="forecast" id="forecast"></div>
    </div>
  </div>

  <script>
    // Smooth auto-refresh κάμερας κάθε 10 δευτ.
    setInterval(() => {
      const iframe = document.getElementById('camFrame');
      if(iframe.contentWindow){ iframe.contentWindow.location.reload(); }
    }, 10000);

    // Map weather code -> Weather Icons class
    function weatherCodeToClass(code){
      if(code === 0) return "wi-day-sunny";
      if(code <= 3) return "wi-day-cloudy";
      if(code <= 48) return "wi-fog";
      if(code <= 67) return "wi-rain";
      if(code <= 77) return "wi-snow";
      if(code <= 99) return "wi-thunderstorm";
      return "wi-day-sunny";
    }

    function weatherCodeToText(code){
      if(code === 0) return "Καθαρός ουρανός";
      if(code <= 3) return "Συννεφιά";
      if(code <= 48) return "Ομίχλη";
      if(code <= 67) return "Βροχή/Χιονόνερο";
      if(code <= 77) return "Χιόνι";
      if(code <= 99) return "Καταιγίδα";
      return "Άγνωστο";
    }

    async function getWeather() {
      const lat = 40.3933, lon = 21.8375;
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode,windspeed_10m,relativehumidity_2m`);
        const data = await response.json();
        const weather = data.current_weather;

        document.getElementById("temp").textContent = `Θερμοκρασία: ${weather.temperature}°C`;
        document.getElementById("wind").textContent = `Άνεμος: ${weather.windspeed} km/h`;
        document.getElementById("humidity").textContent = weather.relativehumidity !== undefined ? `Υγρασία: ${weather.relativehumidity}%` : `Υγρασία: -`;
        document.getElementById("condition").textContent = `Κατάσταση: ${weatherCodeToText(weather.weathercode)}`;
        const iconEl = document.getElementById("icon");
        iconEl.className = "wi " + weatherCodeToClass(weather.weathercode);

        // Πρόγνωση επόμενων 6 ωρών
        const forecastContainer = document.getElementById("forecast");
        forecastContainer.innerHTML = "";
        const hours = data.hourly.time.slice(0,6);
        const temps = data.hourly.temperature_2m.slice(0,6);
        const codes = data.hourly.weathercode.slice(0,6);

        for(let i=0; i<6; i++){
          const hour = new Date(hours[i]).getHours();
          const item = document.createElement("div");
          item.className = "forecast-item";
          item.innerHTML = `<div>${hour}:00</div><i class="wi ${weatherCodeToClass(codes[i])}"></i><div>${temps[i]}°C</div>`;
          forecastContainer.appendChild(item);
        }

      } catch(err){ console.error("Σφάλμα στην ανάκτηση δεδομένων:", err); }
    }

    getWeather();
    setInterval(getWeather, 600000); // κάθε 10 λεπτά
  </script>
</body>
</html>
