<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Τσοτύλι – Κάμερα & Καιρός</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f2f2f2;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 800px;
    }
    iframe {
      width: 100%;
      height: 480px;
      border: 0;
      margin: 10px 0;
    }
    .weather {
      width: 100%;
      text-align: center;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    @media (min-width: 600px) {
      .container {
        flex-direction: row;
        justify-content: space-between;
      }
      iframe, .weather {
        width: 48%;
      }
    }
  </style>
</head>
<body>
  <h1>Τσοτύλι – Ζωντανή Κάμερα & Καιρός</h1>
  <div class="container">
    <iframe id="camFrame" src="https://www.meteology.gr/kamera_tsotyli.html"></iframe>

    <div class="weather">
      <!-- Εδώ μπορεί να βάλεις πρόγνωση καιρού από yr.no ή άλλο API -->
      <h2>Πρόγνωση Καιρού</h2>
      <p>Θερμοκρασία: 0°C</p>
      <p>Άνεμος: 0 km/h</p>
      <p>Υγρασία: 0%</p>
      <p>Κατάσταση: Συννεφιά</p>
    </div>
  </div>

  <script>
    // Auto-refresh της κάμερας κάθε 10 δευτερόλεπτα
    setInterval(function() {
      var iframe = document.getElementById('camFrame');
      iframe.src = iframe.src;
    }, 10000);
  </script>
</body>
</html>
